name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-check:
    name: 仓库规范自检
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 检查结构、密钥、大文件与编码
        run: bash scripts/check-repo.sh

  commit-lint:
    name: 提交信息规范
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 校验 PR 标题
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-commit-msg.sh --text "$PR_TITLE"

      - name: 校验本次改动范围内的提交
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-commit-msg.sh --range "$BASE_SHA..$HEAD_SHA"

      - name: 校验最近一次提交
        if: github.event_name != 'pull_request'
        run: bash scripts/check-commit-msg.sh --range "HEAD~1..HEAD" || bash scripts/check-commit-msg.sh --range "HEAD"

  project-checks:
    name: 项目级检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 运行项目自定义检查
        run: |
          if [ -f scripts/local-checks.sh ]; then
            bash scripts/local-checks.sh
          else
            echo "未提供 scripts/local-checks.sh —— 请在此挂载构建、Lint、测试命令。"
            echo "（当前仓库为不绑定技术栈的骨架，故此项默认跳过）"
          fi
