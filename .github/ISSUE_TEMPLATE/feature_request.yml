name: 功能建议
description: 提出一个新功能或改进（请先说明它与评分点的关系）
title: "feat(模块): 一句话描述能力"
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        黑客松时间有限，**请先说明这个需求对应哪个评分维度或用户痛点**，否则很难排期。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到什么问题？有没有数据或证据？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你希望怎么实现？有替代方案吗？
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P0 必须有（缺了演示不完整）
        - P1 应该有（有时间就做）
        - P2 可以有（锦上添花）
    validations:
      required: true

  - type: input
    id: scoring
    attributes:
      label: 关联评分点
      description: 对应 docs/03-评审对照表.md 里的哪一条？
      placeholder: 技术完成度 / 实用价值
    validations:
      required: false

  - type: textarea
    id: cost
    attributes:
      label: 预估成本与风险
      placeholder: 约 3 小时；依赖外部接口，可能不可用，需要兜底。
    validations:
      required: false
