  <style>
    .rain{animation:rain 1.8s linear infinite}.rain-back{animation:rain 2.7s linear infinite}.lantern{transform-origin:652px 468px;animation:swing 8s ease-in-out infinite}.lamp-glow{animation:glow 8s ease-in-out infinite}.reflection{animation:reflection 8s ease-in-out infinite}.ripple-a{transform-origin:548px 945px;animation:ripple 5s ease-out infinite}.ripple-b{transform-origin:730px 1043px;animation:ripple 6s ease-out -2s infinite}.ripple-c{transform-origin:415px 1080px;animation:ripple 5.5s ease-out -3s infinite}.reel-one{transform-origin:418px 1090px;animation:turn 13s linear infinite}.reel-two{transform-origin:506px 1090px;animation:turn 13s linear infinite}.ribbon{transform-origin:617px 1140px;animation:ribbon 7s ease-in-out infinite}
    @keyframes rain{to{transform:translateY(180px)}}@keyframes swing{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}@keyframes glow{0%,100%{opacity:.52}50%{opacity:.72}}@keyframes reflection{0%,100%{opacity:.45;transform:translateX(-3px)}50%{opacity:.7;transform:translateX(3px)}}@keyframes ripple{0%{opacity:0;transform:scale(.15)}15%{opacity:.7}100%{opacity:0;transform:scale(1.6)}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes ribbon{0%,100%{transform:rotate(-2deg) skewX(-1deg)}50%{transform:rotate(3deg) skewX(2deg)}}
    @media(prefers-reduced-motion:reduce){.rain,.rain-back,.lantern,.lamp-glow,.reflection,.ripple-a,.ripple-b,.ripple-c,.reel-one,.reel-two,.ribbon{animation:none}.ripple-a,.ripple-b,.ripple-c{opacity:.35}}
  </style>
