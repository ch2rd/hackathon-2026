    <linearGradient id="hall" x2="0" y2="1"><stop stop-color="#070e10" /><stop offset=".5" stop-color="#13201e" /><stop offset="1" stop-color="#1d2a25" /></linearGradient>
    <radialGradient id="warm"><stop stop-color="#cd7750" stop-opacity=".48" /><stop offset=".32" stop-color="#934c36" stop-opacity=".27" /><stop offset="1" stop-color="#493a27" stop-opacity="0" /></radialGradient>
    <linearGradient id="lamp" x2="1"><stop stop-color="#42231e" /><stop offset=".25" stop-color="#9b5138" /><stop offset=".55" stop-color="#d09059" /><stop offset=".82" stop-color="#82402f" /><stop offset="1" stop-color="#351e1a" /></linearGradient>
    <linearGradient id="machine" x2="0" y2="1"><stop stop-color="#716d56" /><stop offset=".08" stop-color="#898268" /><stop offset=".15" stop-color="#485149" /><stop offset=".8" stop-color="#1d2b27" /><stop offset="1" stop-color="#101c1a" /></linearGradient>
