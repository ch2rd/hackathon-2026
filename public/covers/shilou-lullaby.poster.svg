<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">石楼童谣 · 雨夜旧校舍动态封面</title>
  <desc id="desc">江南山村的旧女生宿舍，雨落在石楼天井的积水里。长廊尽头一盏暗红灯轻轻摇晃，潮湿石墙与青苔逐渐没入黑暗。前景的老式磁带录音机缓缓转动，松开的红丝带随风摆动。无缝循环的雨丝、水波与灯影，不含鬼脸、血腥或谜底；减少动态偏好下呈现静态画面。</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1"><stop stop-color="#101b20" /><stop offset=".48" stop-color="#141c1b" /><stop offset="1" stop-color="#060d0e" /></linearGradient>
