<svg xmlns="http://www.w3.org/2000/svg" xmlns:ns1="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1500" fill="none" role="img" aria-labelledby="title description">
  <title id="title">末班列车 · 三点十七分的站台</title>
  <desc id="description">一列复古绿皮火车停在雨夜的荒废站台。悬挂的旧时钟指向三点十七分，青色薄雾掠过轨道，红色信号灯映在湿润钢轨上。雨、灯影与雾气无缝缓慢循环，支持减少动态效果设置。</desc>
  <defs>
    <linearGradient id="sky" x1="600" y1="0" x2="600" y2="1500" gradientUnits="userSpaceOnUse"><stop stop-color="#080e14" /><stop offset=".4" stop-color="#1d353b" /><stop offset=".69" stop-color="#10242b" /><stop offset="1" stop-color="#060b10" /></linearGradient>
    <radialGradient id="haze"><stop stop-color="#9bc1b8" stop-opacity=".3" /><stop offset="1" stop-color="#7caaa3" stop-opacity="0" /></radialGradient>
    <linearGradient id="train" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#354b48" /><stop offset=".35" stop-color="#2c4642" /><stop offset=".53" stop-color="#68736a" /><stop offset=".57" stop-color="#897f64" /><stop offset=".61" stop-color="#2f4840" /><stop offset="1" stop-color="#101e20" /></linearGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62756b" /><stop offset=".38" stop-color="#3a554c" /><stop offset=".75" stop-color="#1e3530" /><stop offset="1" stop-color="#101f22" /></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5a6f70" /><stop offset=".35" stop-color="#1b2f33" /><stop offset=".72" stop-color="#101e24" /><stop offset="1" stop-color="#486264" /></linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#586363" /><stop offset=".4" stop-color="#1c3035" /><stop offset="1" stop-color="#0a151d" /></linearGradient>
    <linearGradient id="windows" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b7ae83" /><stop offset=".45" stop-color="#8c926c" /><stop offset="1" stop-color="#364944" /></linearGradient>
    <radialGradient id="lamp"><stop stop-color="#e8d3a0" stop-opacity=".65" /><stop offset=".18" stop-color="#cfbe8d" stop-opacity=".2" /><stop offset="1" stop-color="#b8c9a0" stop-opacity="0" /></radialGradient>
    <radialGradient id="signal"><stop stop-color="#de6554" stop-opacity=".85" /><stop offset=".1" stop-color="#bd4b40" stop-opacity=".38" /><stop offset="1" stop-color="#bd4b40" stop-opacity="0" /></radialGradient>
    <linearGradient id="lightbeam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b7c6af" stop-opacity=".18" /><stop offset="1" stop-color="#b7c6af" stop-opacity="0" /></linearGradient>
    <linearGradient id="fog"><stop stop-color="#c1d8ce" stop-opacity="0" /><stop offset=".3" stop-color="#b0cfc3" stop-opacity=".12" /><stop offset=".65" stop-color="#adcac1" stop-opacity=".22" /><stop offset="1" stop-color="#a8ccc5" stop-opacity="0" /></linearGradient>
    <linearGradient id="redReflection" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ce5b48" stop-opacity=".48" /><stop offset="1" stop-color="#963e34" stop-opacity="0" /></linearGradient>
    <radialGradient id="vignette"><stop offset=".2" stop-color="#02090e" stop-opacity="0" /><stop offset=".7" stop-color="#02090e" stop-opacity=".24" /><stop offset="1" stop-color="#02090e" stop-opacity=".92" /></radialGradient>
    <pattern id="rain" width="193" height="210" patternUnits="userSpaceOnUse"><path d="m18 12-12 49m92 21-9 40m83 37-14 59m-80 4-7 28m-46-112-11 52" stroke="#c6e0dc" stroke-width="1" stroke-opacity=".22" /></pattern>
    <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter>
    <g id="trainWindow"><path d="M0 0 43-4v61L0 63Z" fill="#0a1c21" stroke="#768b7c" stroke-width="3" /><path d="m5 5 33-3v49L5 55Z" fill="url(#windows)" /><path d="m4 26 34-4" stroke="#1c3634" stroke-width="3" /><path d="m11 7-6 45m25-47-7 46" stroke="#d8d2ae" stroke-opacity=".18" stroke-width="2" /></g>
    <g id="lampShade"><path d="M-33 1c7-21 59-21 66 0Z" fill="#16292e" stroke="#6c817b" stroke-width="2" /><ellipse cy="3" rx="32" ry="6" fill="#8e9b82" /><ellipse cy="4" rx="15" ry="4" fill="#e0cea1" /></g>
  </defs>
  <style>
    .rain{animation:rainfall 1.65s linear infinite}.fog-near{animation:fogflow 24s ease-in-out infinite}.fog-far{animation:fogflow 31s ease-in-out infinite reverse}.lamp-glow{animation:lamplight 10s ease-in-out infinite}.red-glow{animation:signalbreathe 7s ease-in-out infinite}.reflection{animation:reflection 8s ease-in-out infinite}.steam{animation:steam 15s ease-in-out infinite}
    @keyframes rainfall{from{transform:translateY(-210px)}to{transform:translateY(0)}}
    @keyframes fogflow{0%,100%{transform:translateX(-50px);opacity:.65}50%{transform:translateX(50px);opacity:1}}
    @keyframes lamplight{0%,100%{opacity:.85}40%{opacity:1}63%{opacity:.79}81%{opacity:.93}}
    @keyframes signalbreathe{0%,100%{opacity:.8}50%{opacity:1}}
    @keyframes reflection{0%,100%{opacity:.45;transform:translateX(-3px)}50%{opacity:.8;transform:translateX(3px)}}
    @keyframes steam{0%,100%{transform:translate(-12px,4px);opacity:.4}50%{transform:translate(15px,-8px);opacity:.75}}
    @media(prefers-reduced-motion:reduce){.rain,.fog-near,.fog-far,.lamp-glow,.red-glow,.reflection,.steam{animation:none}}
  </style>
