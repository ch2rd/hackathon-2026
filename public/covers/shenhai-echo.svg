<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">深海回音 · 海底科考站动态封面</title>
  <desc id="desc">三千二百米海水之下，一座老旧科考站的灯仍亮着。透过厚重观察舷窗，幽蓝探照灯缓缓掠过海底，气泡与微小浮游颗粒向远方漂去。舷窗前的旧耳机与仪表静静等待回音。无缝循环动画，减少动态偏好下呈现静态画面。</desc>
  <defs>
    <radialGradient id="sea" cx="56%" cy="38%" r="76%"><stop stop-color="#174653"/><stop offset=".42" stop-color="#09272f"/><stop offset=".78" stop-color="#041318"/><stop offset="1" stop-color="#02090c"/></radialGradient>
    <linearGradient id="wall" x2=".8" y2="1"><stop stop-color="#171d1d"/><stop offset=".38" stop-color="#0c1215"/><stop offset=".75" stop-color="#1c2222"/><stop offset="1" stop-color="#080d0f"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#757363"/><stop offset=".17" stop-color="#3e4d4b"/><stop offset=".44" stop-color="#14292d"/><stop offset=".67" stop-color="#777b68"/><stop offset=".82" stop-color="#1d3439"/><stop offset="1" stop-color="#4b5046"/></linearGradient>
    <radialGradient id="edge"><stop offset=".72" stop-color="#080f13" stop-opacity="0"/><stop offset=".92" stop-color="#020608" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
    <linearGradient id="tube" x2="0" y2="1"><stop stop-color="#2c3e40"/><stop offset=".22" stop-color="#698789"/><stop offset=".4" stop-color="#334d50"/><stop offset=".8" stop-color="#142b30"/><stop offset="1" stop-color="#0b1c20"/></linearGradient>
    <linearGradient id="dome" x2="0" y2="1"><stop stop-color="#52787b"/><stop offset=".32" stop-color="#334d51"/><stop offset="1" stop-color="#112c31"/></linearGradient>
    <linearGradient id="lamp"><stop stop-color="#b8d9cf" stop-opacity=".44"/><stop offset=".4" stop-color="#6dabb0" stop-opacity=".12"/><stop offset="1" stop-color="#82b7b9" stop-opacity="0"/></linearGradient>
    <radialGradient id="lampGlow"><stop stop-color="#e7d6a2"/><stop offset=".24" stop-color="#d2cb9e" stop-opacity=".6"/><stop offset="1" stop-color="#d2cb9e" stop-opacity="0"/></radialGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#d1c28a"/><stop offset=".44" stop-color="#91a393"/><stop offset="1" stop-color="#416462"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#add4d1" stop-opacity=".1"/><stop offset=".37" stop-color="#add4d1" stop-opacity="0"/><stop offset=".75" stop-color="#a5c5bb" stop-opacity=".04"/><stop offset="1" stop-color="#d4e0cd" stop-opacity=".13"/></linearGradient>
