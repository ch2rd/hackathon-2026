  <style>
    .beam{transform-origin:651px 658px;animation:beam 15s ease-in-out infinite}.silt-one{animation:driftOne 23s linear infinite}.silt-two{animation:driftTwo 29s linear infinite}.bubble-a{animation:bubble 15s linear infinite}.bubble-b{animation:bubble 19s linear -7s infinite}.waterlight{animation:waterlight 10s ease-in-out infinite}.grass{transform-origin:600px 1010px;animation:grass 9s ease-in-out infinite}.needle{transform-origin:305px 1151px;animation:needle 9s ease-in-out infinite}.led{animation:led 7s ease-in-out infinite}
    @keyframes beam{0%,100%{transform:rotate(-5deg);opacity:.65}50%{transform:rotate(5deg);opacity:.9}}@keyframes driftOne{0%{transform:translate(0,30px);opacity:0}12%,82%{opacity:.48}100%{transform:translate(-43px,-50px);opacity:0}}@keyframes driftTwo{0%{transform:translate(0,42px);opacity:0}15%,85%{opacity:.32}100%{transform:translate(42px,-45px);opacity:0}}@keyframes bubble{0%{transform:translate(0,55px);opacity:0}12%,75%{opacity:.6}100%{transform:translate(14px,-132px);opacity:0}}@keyframes waterlight{0%,100%{opacity:.42}50%{opacity:.7}}@keyframes grass{0%,100%{transform:skewX(-2deg)}50%{transform:skewX(2deg)}}@keyframes needle{0%,100%{transform:rotate(-8deg)}46%{transform:rotate(4deg)}62%{transform:rotate(1deg)}}@keyframes led{0%,100%{opacity:.45}50%{opacity:.9}}
    @media(prefers-reduced-motion:reduce){.beam,.silt-one,.silt-two,.bubble-a,.bubble-b,.waterlight,.grass,.needle,.led{animation:none}.silt-one,.silt-two{opacity:.35}.bubble-a,.bubble-b{opacity:.6}}
  </style>
