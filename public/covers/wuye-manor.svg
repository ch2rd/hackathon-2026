<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1500" fill="none" role="img" aria-labelledby="title description">
  <title id="title">雾夜庄园 · 雨中的钟楼</title>
  <desc id="description">冷蓝雾气笼罩孤立的古老庄园，铁门后的石径通向亮着暖灯的宅邸与钟楼。细雨持续落下，雾缓缓流动，远处天空偶尔泛起柔和电光。封面无故事谜底，支持减少动态效果设置。</desc>
  <defs>
    <linearGradient id="sky" x1="600" y1="0" x2="600" y2="1500" gradientUnits="userSpaceOnUse"><stop stop-color="#080d16"/><stop offset=".38" stop-color="#243d50"/><stop offset=".69" stop-color="#101e29"/><stop offset="1" stop-color="#060b11"/></linearGradient>
    <radialGradient id="moonlight"><stop stop-color="#bfd0cc" stop-opacity=".34"/><stop offset=".25" stop-color="#8faeb9" stop-opacity=".15"/><stop offset="1" stop-color="#66899d" stop-opacity="0"/></radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48565d"/><stop offset=".45" stop-color="#26343d"/><stop offset="1" stop-color="#101a23"/></linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45505a"/><stop offset=".62" stop-color="#27323c"/><stop offset="1" stop-color="#131e28"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1a2731"/><stop offset=".55" stop-color="#101820"/><stop offset="1" stop-color="#070e15"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7c8279" stop-opacity=".24"/><stop offset=".3" stop-color="#5b686d" stop-opacity=".32"/><stop offset="1" stop-color="#1f2c35" stop-opacity=".12"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b59a66"/><stop offset=".52" stop-color="#b58b4f"/><stop offset="1" stop-color="#4f3c28"/></linearGradient>
    <linearGradient id="warmReflection" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c6aa6d" stop-opacity=".35"/><stop offset="1" stop-color="#ac9054" stop-opacity="0"/></linearGradient>
    <linearGradient id="mist"><stop stop-color="#adc9cf" stop-opacity="0"/><stop offset=".4" stop-color="#adc9cf" stop-opacity=".12"/><stop offset=".7" stop-color="#adc9cf" stop-opacity=".2"/><stop offset="1" stop-color="#adc9cf" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#d9bc7b" stop-opacity=".42"/><stop offset=".23" stop-color="#d9bc7b" stop-opacity=".17"/><stop offset="1" stop-color="#c5a66a" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette"><stop offset=".25" stop-color="#02070d" stop-opacity="0"/><stop offset=".72" stop-color="#02070d" stop-opacity=".3"/><stop offset="1" stop-color="#02070d" stop-opacity=".9"/></radialGradient>
    <pattern id="slate" width="55" height="25" patternUnits="userSpaceOnUse"><path d="M0 24H55M27 0V24M0 12H55" stroke="#9daab1" stroke-opacity=".075" stroke-width="1"/></pattern>
    <pattern id="rain" width="170" height="190" patternUnits="userSpaceOnUse"><path d="M15 10 2 55M83 80 68 130M156 2 139 62M125 156 115 190M43 153 33 190" stroke="#c5d8de" stroke-opacity=".24" stroke-width="1"/></pattern>
    <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <g id="window"><path d="M-13 42V3A13 13 0 0 1 13 3V42Z" fill="#080f17" stroke="#637079" stroke-opacity=".7" stroke-width="3"/><path d="M-9 38V4A9 9 0 0 1 9 4V38Z" fill="url(#warm)"/><path d="M0-5V39M-10 15H10" stroke="#151b22" stroke-width="3"/><path d="M-20 46H20M-18 49H18" stroke="#859096" stroke-opacity=".55" stroke-width="2"/></g>
    <g id="darkWindow"><path d="M-13 42V3A13 13 0 0 1 13 3V42Z" fill="#080f17" stroke="#637079" stroke-opacity=".6" stroke-width="3"/><path d="M0-7V42M-12 15H12" stroke="#34414b" stroke-width="2"/><path d="M-20 46H20" stroke="#65747e" stroke-opacity=".5" stroke-width="2"/></g>
    <g id="spire"><path d="M-7 0 0-33 7 0Z" fill="#0a131b"/><path d="M0-33V-51M-11-43H11" stroke="#5b686c" stroke-width="2"/></g>
    <g id="gateBar"><path d="M0 0V234M-4 8 0-10 4 8Z" fill="#182129" stroke="#52616a" stroke-opacity=".6" stroke-width="2"/></g>
    <g id="lantern"><path d="M-12-28 0-41 12-28 16-22H-16Z" fill="#0a1117" stroke="#6b715e" stroke-width="1.5"/><path d="M-12-21-9 13H9L12-21Z" fill="url(#warm)" stroke="#111b22" stroke-width="3"/><path d="M0-21V13M-8 15 0 23 8 15" stroke="#0b131b" stroke-width="3"/><ellipse cy="-5" rx="60" ry="72" fill="url(#glow)"/></g>
  </defs>
  <style>
    .rain{animation:rainfall 1.35s linear infinite}.mist-a{animation:drift 22s ease-in-out infinite}.mist-b{animation:drift 29s ease-in-out infinite reverse}.lightning{animation:skyglow 18s ease-in-out infinite}.warm-lights{animation:candle 9s ease-in-out infinite}.water{animation:ripple 7s ease-in-out infinite}
    @keyframes rainfall{from{transform:translate(0,-190px)}to{transform:translate(0,0)}}
    @keyframes drift{0%,100%{transform:translateX(-42px);opacity:.68}50%{transform:translateX(42px);opacity:1}}
    @keyframes skyglow{0%,71%,79%,100%{opacity:0}75%{opacity:.24}}
    @keyframes candle{0%,100%{opacity:.88}32%{opacity:1}57%{opacity:.84}78%{opacity:.96}}
    @keyframes ripple{0%,100%{opacity:.42;transform:translateX(-4px)}50%{opacity:.76;transform:translateX(4px)}}
    @media(prefers-reduced-motion:reduce){.rain,.mist-a,.mist-b,.lightning,.warm-lights,.water{animation:none}.lightning{opacity:0}}
  </style>
